# ci.yml
#
# v0.0.09:
#   - install ShellCheck for the administration script CTest gate
#   - run split-config, CLI and executable-script tests through CTest
#
# v0.0.02:
#   - install libgcrypt development package for TIGR
#   - execute CTest after the Debian 13 build
#
# v0.0.01:
#   - build dc24h.eu in a Debian 13 container
#
# Author: gpt-5.6-sol
# Date: 2026-08-21

name: build

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

jobs:
  debian-13:
    runs-on: ubuntu-latest
    container: debian:13

    steps:
      - name: Install CI prerequisites
        run: |
          apt-get update
          apt-get install -y git ca-certificates build-essential cmake pkg-config libmariadb-dev libgcrypt20-dev shellcheck

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
